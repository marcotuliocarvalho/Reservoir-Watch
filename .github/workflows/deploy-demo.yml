name: Refresh demo

# The demo on Render deploys itself when the CI checks pass on main
# (render.yaml, autoDeployTrigger: checksPass). This workflow only rebuilds
# it every day, without the Docker cache, so the image downloads fresh ONS
# data.
# Setup (once), in GitHub > Settings > Secrets and variables > Actions:
#   secret   RENDER_API_KEY    = API key from https://dashboard.render.com/u/settings#api-keys
#   variable RENDER_SERVICE_ID = id of the "reservoir-watch" service (srv-...)

on:
  schedule:
    - cron: "0 9 * * *" # daily, after ONS publishes the previous day
  workflow_dispatch:

jobs:
  refresh:
    name: Rebuild Render service
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger deploy without cache
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::notice::RENDER_API_KEY or RENDER_SERVICE_ID not set. Skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}'
