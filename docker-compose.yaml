# Local Airflow (standalone: scheduler + api-server + dag-processor + triggerer, SQLite).
# Run: mkdir -p data && docker compose up --build   UI: http://localhost:8080
# DAG: dags/hidrico_ingestion.py -> src/ingestion/pipeline.py (build_dag).
# Output: data/reservatorios_hidrologicos.parquet (raw yearly files in data/raw/).
services:
  airflow:
    build: .
    command: standalone
    restart: unless-stopped
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      PYTHONPATH: /opt/airflow/project
      HIDRIC_DATA_DIR: /opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/project/src:ro
      - ./data:/opt/airflow/data
      - airflow-state:/opt/airflow/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  airflow-state:
